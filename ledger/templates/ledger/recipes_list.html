{% extends 'base.html' %}
{% load static %}


{% block title %}Recipe List{% endblock %}

{% block content %}
    <h3>Recipe List</h3>
    <ul>
        {% for recipe in object_list %}
            <li><a href='{{ recipe.get_absolute_url }}'>{{ recipe.name }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
