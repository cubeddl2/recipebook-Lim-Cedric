{% extends 'base.html' %}
{% load static %}

{% block content %}
    <h3>{{ recipe.name }}</h3>
    <h4>Author: {{ recipe.author.name }}</h4>
    Ingredients:
    <ul>
        {% for ingredient in recipe.ingredients.all %}
        <li>{{ ingredient.quantity }} unit of {{ ingredient.ingredient.name }}</li>
        {% endfor %}
    </ul>
{% endblock %}
