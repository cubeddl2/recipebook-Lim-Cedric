{% extends 'base.html' %}
{% load static %}

{% block title %}Login{% endblock %}
{% block login %}
    <h3>Login</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <a href="{% url 'password_reset' %}">Forgot password?</a>
        <br/>
        <br/>
        <button type="submit">Login</button>
    </form>
{% endblock %}
